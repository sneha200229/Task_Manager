{% extends "base.html" %}
{%block content%}
<h2>Welcome to all tasks page</h2>
{% for task in tasks %}

<div class="task-card">

    <h3>{{ task.title }}</h3>

    <p>{{ task.description }}</p>

    <p>Status: {{ task.status }}</p>

    <p>Priority: {{ task.priority }}</p>

    <a href="{{ url_for('show_task_byid', id=task.id) }}">
        View Details
    </a>

</div>

{% endfor %}
{% endblock %}
